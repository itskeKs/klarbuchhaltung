<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung · Klarbuchhaltung</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f6f1;color:#182819;font:1rem system-ui,sans-serif}
  main{box-sizing:border-box;width:min(25rem,calc(100% - 2rem));padding:2rem;background:white;border:1px solid #dbe2d8;border-radius:1rem}
  h1{font-size:1.55rem;margin:0 0 1.5rem}
  label{display:block;margin:0 0 1rem}
  input,button{box-sizing:border-box;width:100%;padding:.7rem;font:inherit;border:1px solid #94a68f;border-radius:.45rem}
  input{display:block;margin-top:.35rem}
  button{background:#27623d;border-color:#27623d;color:white;font-weight:600}
  .error{color:#a4251b}
</style>
<main>
  <h1>Klarbuchhaltung</h1>
  {% if callback_expired %}
  <p>Die Anmeldung für diese Bankfreigabe ist abgelaufen. Melde dich an und starte die Bankverbindung erneut.</p>
  <a href="/login">Zur Anmeldung</a>
  {% else %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form action="/login" method="post">
    <label>Benutzername<input name="username" autocomplete="username" required maxlength="64"></label>
    <label>Passwort<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button type="submit">Anmelden</button>
  </form>
  {% endif %}
</main>
</html>
